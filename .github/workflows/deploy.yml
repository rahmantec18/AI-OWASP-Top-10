name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Dependencies
        run: |
          cd website
          npm ci

      - name: Build React Application
        run: |
          cd website
          npm run build

      - name: Copy Deliverables to Dist
        run: |
          cp -r 01_Source_Register.xlsx website/dist/ || true
          cp -r 02_AI_Evaluation.xlsx website/dist/ || true
          cp -r 03_Verification_Report.md website/dist/ || true
          cp -r 04_Study_Guide.md website/dist/ || true
          cp -r 05_Quiz_and_Answer_Key.xlsx website/dist/ || true
          cp -r 06_Presentation.pptx website/dist/ || true
          cp -r 07_Prompt_Library.md website/dist/ || true
          cp -r 09_Before_After_Analysis.md website/dist/ || true
          cp -r 10_Ethics_and_Methodology.md website/dist/ || true
          cp -r Automated_Quiz_Export.xlsx website/dist/ || true
          cp -r CAPSTONE9_OWASP_AI_Verification.xlsx website/dist/ || true
          touch website/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
